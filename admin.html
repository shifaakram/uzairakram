<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Upload Content</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="flex justify-between items-center pb-6 border-b border-slate-800">
            <div>
                <h1 class="text-2xl font-bold text-amber-500">Admin Content Dashboard</h1>
                <p class="text-xs text-slate-400 mt-1">Upload worksheets & videos to sync with your main website</p>
            </div>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg font-semibold flex items-center gap-2 border border-slate-700">
                <i data-lucide="external-link" class="w-4 h-4"></i> View Website
            </a>
        </header>

        <!-- Status Alert -->
        <div id="status-msg" class="hidden p-4 rounded-xl text-sm font-medium"></div>

        <div class="grid md:grid-cols-2 gap-8">
            
            <!-- Worksheet Form -->
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center font-bold">
                        <i data-lucide="file-text" class="w-5 h-5"></i>
                    </div>
                    <h2 class="text-lg font-bold text-white">Upload Worksheet</h2>
                </div>

                <form id="worksheet-form" onsubmit="handleUpload(event, 'Worksheets')" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Title</label>
                        <input type="text" name="Title" required placeholder="e.g., Chapter 2 - My Friends" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Description</label>
                        <input type="text" name="Description" required placeholder="e.g., General Knowledge Practice" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Class / Grade</label>
                        <input type="text" name="Grade" required placeholder="e.g., KG, Class 8" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Google Drive PDF Link (URL)</label>
                        <input type="url" name="FileLink" required placeholder="https://drive.google.com/file/d/..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-slate-200">
                    </div>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Add Worksheet
                    </button>
                </form>
            </div>

            <!-- Video Form -->
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center font-bold">
                        <i data-lucide="video" class="w-5 h-5"></i>
                    </div>
                    <h2 class="text-lg font-bold text-white">Upload Video Lesson</h2>
                </div>

                <form id="video-form" onsubmit="handleUpload(event, 'Videos')" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Video Title</label>
                        <input type="text" name="Title" required placeholder="e.g., Intro to Equations" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Description</label>
                        <input type="text" name="Description" required placeholder="e.g., Lesson 1 explanations" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Subject</label>
                        <input type="text" name="Subject" required placeholder="e.g., Mathematics, Science" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Video Link (YouTube / Drive Link)</label>
                        <input type="url" name="VideoURL" required placeholder="https://youtube.com/watch?v=..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-slate-200">
                    </div>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Add Video
                    </button>
                </form>
            </div>

        </div>
    </div>

    <script>
        // REPLACE THIS WITH YOUR DEPLOYED GOOGLE WEB APP URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxoZ23L9HWQnrkia1vSTNGPTvAYfbHcVDRGEprQpUdp_84TANXuk-6qID2Ww91ViwA1UA/exec";

        async function handleUpload(e, sheetName) {
            e.preventDefault();
            const form = e.target;
            const submitBtn = form.querySelector('button[type="submit"]');
            const statusMsg = document.getElementById('status-msg');

            // Collect form data
            const formData = new FormData(form);
            const payload = {
                sheet: sheetName,
                action: "insert"
            };
            formData.forEach((value, key) => payload[key] = value);

            // UI Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = `Uploading...`;

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Show success
                statusMsg.className = "p-4 rounded-xl text-sm font-medium bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 block";
                statusMsg.textContent = `Successfully added to ${sheetName}! Refresh your main website to view it.`;
                form.reset();
            } catch (error) {
                console.error(error);
                statusMsg.className = "p-4 rounded-xl text-sm font-medium bg-red-500/10 border border-red-500/30 text-red-400 block";
                statusMsg.textContent = "Error saving data. Please check connection.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i data-lucide="plus-circle" class="w-4 h-4"></i> Add ${sheetName === 'Worksheets' ? 'Worksheet' : 'Video'}`;
                lucide.createIcons();
            }
        }

        lucide.createIcons();
    </script>
</body>
</html>
